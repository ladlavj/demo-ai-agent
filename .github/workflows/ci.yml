name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-and-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          
      - name: Secret Scanner (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Bandit (Security Linter)
        run: pip install bandit
        
      - name: Run Bandit Security Check
        run: bandit -r src/ -ll -ii

  lint:
    runs-on: ubuntu-latest
    needs: security-and-secrets
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install flake8
        run: pip install flake8
          
      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all other errors as warnings (max length, etc)
          flake8 src/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  test:
    # Only run tests if the event triggering the action is a pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [security-and-secrets, lint]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run unit tests
        env:
          GOOGLE_API_KEY: dummy_key_for_testing
          SLACK_BOT_TOKEN: dummy_xoxb_token
          SLACK_APP_TOKEN: dummy_xapp_token
          OPENWEATHER_API_KEY: dummy_weather_key
        run: |
          python -m unittest discover -s tests -p "test_*.py"
